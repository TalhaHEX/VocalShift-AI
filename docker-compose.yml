services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: audio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: ./Backend
    ports:
      - "3003:3003"
    volumes:
      - ./Backend:/app
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:root@db:5432/audio_db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./Backend/.env
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./Backend
    command: celery -A src.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./Backend:/app
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:root@db:5432/audio_db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./Backend/.env
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./Frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3003
    depends_on:
      - web

volumes:
  postgres_data:
